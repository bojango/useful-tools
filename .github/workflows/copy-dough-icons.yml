name: Copy DoughCalculator icons

on:
  push:
    paths:
      - '.github/workflows/copy-dough-icons.yml'

permissions:
  contents: write

jobs:
  copy-icons:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy exact icon files
        run: |
          curl -fsSL https://raw.githubusercontent.com/bojango/DoughCalculator/main/icon-192.png -o icon-192.png
          curl -fsSL https://raw.githubusercontent.com/bojango/DoughCalculator/main/icon-512.png -o icon-512.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Copy DoughCalculator icons"
          git push
